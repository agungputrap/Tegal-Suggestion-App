name = "jajan-jasa-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --- D1: source of truth (providers, checkins, categories) ---
[[d1_databases]]
binding = "DB"
database_name = "jajan-jasa-db"
database_id = "dca069e3-5e8b-4c07-80a8-45cc311a994c"

# --- KV: cache daftar aktif hari ini per kota (read-heavy) ---
[[kv_namespaces]]
binding = "ACTIVE_CACHE"
id = "789f5cb14b8942eb9e245670c731b3d3"

# --- R2: foto jajanan / portofolio jasa ---
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "jajan-jasa-photos"

# --- Cron: 17:00 UTC (00:00 WIB) expire checkin kemarin; 23:00 UTC (06:00 WIB) ping harian bot ---
[triggers]
crons = ["0 17 * * *", "0 23 * * *"]

[vars]
ENVIRONMENT = "development"
